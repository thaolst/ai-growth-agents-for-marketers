name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          find . -name 'agent.py' -not -path './.git/*' | while read f; do
            python3 -m py_compile "$f" && echo "ok: $f" || { echo "syntax error: $f"; exit 1; }
          done
          echo "All Python files valid"

      - name: Check key files exist
        run: |
          for f in README.md requirements.txt .env.example LICENSE CONTRIBUTING.md; do
            [ -f "$f" ] && echo "ok: $f" || { echo "missing: $f"; exit 1; }
          done

      - name: Check skills have SKILL.md
        run: |
          for skill in skills/*/; do
            [ -f "${skill}SKILL.md" ] && echo "ok: ${skill}SKILL.md" || { echo "missing: ${skill}SKILL.md"; exit 1; }
          done
